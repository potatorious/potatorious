<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="455" viewBox="0 0 1100 455" role="img" aria-labelledby="title desc">
  <title id="title">Windows 11 Windows Terminal — PowerShell</title>
  <desc id="desc">A faithful dark Windows 11 Terminal window with a PowerShell tab, displaying still learning, still building, under construction.</desc>
  <defs>
    <clipPath id="window"><rect x="0" y="0" width="1100" height="455" rx="13"/></clipPath>
    <linearGradient id="psicon" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2088cf"/><stop offset="1" stop-color="#064b9a"/></linearGradient>
  </defs>
  <g clip-path="url(#window)">
    <rect width="1100" height="455" fill="#0c0c0c"/>
    <rect x="0" y="0" width="1100" height="51" fill="#242424"/>
    <!-- Windows Terminal active tab, flush into content -->
    <path d="M13 50 V18 Q13 8 23 8 H274 Q284 8 284 18 V50 Z" fill="#0c0c0c"/>
    <path d="M13 50 V18 Q13 8 23 8 H274 Q284 8 284 18 V50" fill="none" stroke="#303030" stroke-width="0.9"/>
    <!-- Windows PowerShell logo -->
    <rect x="27" y="18" width="22" height="22" rx="3" fill="url(#psicon)"/>
    <path d="M32 24 L38 29 L32 35" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 35 H44" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
    <text x="60" y="34" fill="#f0f0f0" font-family="Segoe UI, Arial, sans-serif" font-size="17">Windows PowerShell</text>
    <!-- active tab close -->
    <path d="M257 26 l7 7 m0 -7 l-7 7" stroke="#b9b9b9" stroke-width="1.35" stroke-linecap="round"/>
    <!-- + dropdown controls -->
    <path d="M307 24 V36 M301 30 H313" stroke="#cccccc" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M337 28 l5 5 5 -5" fill="none" stroke="#cccccc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Windows titlebar controls -->
    <path d="M981 28 H996" stroke="#dddddd" stroke-width="1.2"/>
    <rect x="1030" y="22.5" width="12.5" height="12.5" fill="none" stroke="#dddddd" stroke-width="1.2"/>
    <path d="M1072 23 l12 12 m0 -12 l-12 12" stroke="#dddddd" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Text inside real-style PowerShell panel -->
    <g font-family="Consolas, 'Cascadia Mono', 'Liberation Mono', monospace" font-size="20" fill="#efefef">
      <text x="26" y="98">Windows PowerShell</text>
      <text x="26" y="130">Copyright (C) Microsoft Corporation. All rights reserved.</text>
      <text x="26" y="202">PS C:\Users\potatorious&gt; Get-Content .\status.txt</text>
      <text x="26" y="250">still learning. still building.</text>
      <text x="26" y="282">under construction.</text>
      <text x="26" y="355">PS C:\Users\potatorious&gt;</text>
      <rect x="314" y="335" width="12" height="22" fill="#f1f1f1"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1098.5" height="453.5" rx="12.3" fill="none" stroke="#474747" stroke-width="1.5"/>
</svg>